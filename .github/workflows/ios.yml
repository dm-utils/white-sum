# iOS build for TestFlight (design section 16, ADR 0007). Manual run or a pushed tag v<config/version>, never on an
# ordinary push. Job export: Godot on Linux writes the Xcode project. Job build: xcodebuild on macOS, signing, checks,
# upload. signing=false is an unsigned compile check that needs no secrets.
name: iOS

on:
  workflow_dispatch:
    inputs:
      signing:
        description: "Sign the build (false: unsigned compile check, no secrets needed)"
        type: boolean
        default: true
      upload:
        description: "Upload to TestFlight (only with signing)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: ios
  cancel-in-progress: false

permissions:
  contents: read

env:
  MIN_CHECKS: "307" # same as ci.yml
  BUNDLE_ID: nl.steefbeest.whitesum
  MIN_IOS: "16.0" # export_presets.cfg, min_ios_version

jobs:
  export:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      signing: ${{ steps.version.outputs.signing }}
      upload: ${{ steps.version.outputs.upload }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Kit pin (the submodule must be exactly the release tag)
        run: |
          v=$(cat addons/white_kit/VERSION)
          git -C addons/white_kit fetch --depth=1 origin "refs/tags/v$v:refs/tags/v$v"
          tagged=$(git -C addons/white_kit rev-parse "v$v^{commit}")
          head=$(git -C addons/white_kit rev-parse HEAD)
          if [ "$tagged" != "$head" ]; then echo "::error::addons/white_kit is not at tag v$v"; exit 1; fi
          echo "White Kit v$v" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./addons/white_kit/ci/setup-godot

      - name: Import project
        run: timeout 600 godot --headless --path . --import

      - name: Kit tests
        run: timeout 300 godot --headless --path . res://addons/white_kit/tests/run_kit_tests.tscn -- --min-checks=764

      - name: Game tests
        run: timeout 300 godot --headless --path . res://tests/run_tests.tscn -- --min-checks=${{ env.MIN_CHECKS }}

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          IN_SIGNING: ${{ inputs.signing }}
          IN_UPLOAD: ${{ inputs.upload }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::config/version '$version' is not 1 to 3 dot-separated integers"; exit 1
          fi
          if [ "$EVENT" = push ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME is not v$version (config/version)"; exit 1
          fi
          signing=false; upload=false
          if [ "$EVENT" = push ] || [ "$IN_SIGNING" = true ]; then signing=true; fi
          if [ "$signing" = true ] && { [ "$EVENT" = push ] || [ "$IN_UPLOAD" = true ]; }; then upload=true; fi
          {
            echo "version=$version"
            echo "build=$RUN_NUMBER"
            echo "signing=$signing"
            echo "upload=$upload"
          } >> "$GITHUB_OUTPUT"
          echo "iOS version $version, build $RUN_NUMBER, signing $signing, upload $upload" >> "$GITHUB_STEP_SUMMARY"

      - name: Fill the preset (runner copy only)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          SIGNING: ${{ steps.version.outputs.signing }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # unsigned check: Godot needs some team id; a placeholder keeps it free of any account data
          if [ -z "$TEAM_ID" ] && [ "$SIGNING" != true ]; then TEAM_ID=ABCDE12345; fi
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::repository variable APPLE_TEAM_ID must be 10 characters A-Z0-9"; exit 1
          fi
          python3 -I - <<'EOF'
          import os, sys
          path = "export_presets.cfg"
          text = open(path).read()
          subs = {
              'application/short_version=""': 'application/short_version="%s"' % os.environ["VERSION"],
              'application/version=""': 'application/version="%s"' % os.environ["BUILD"],
              'application/app_store_team_id=""': 'application/app_store_team_id="%s"' % os.environ["TEAM_ID"],
          }
          lines = text.split("\n")
          for old, new in subs.items():
              hits = [i for i, l in enumerate(lines) if l == old]
              if len(hits) != 1:
                  sys.exit("::error::%s occurs %d times in export_presets.cfg, expected 1" % (old, len(hits)))
              lines[hits[0]] = new
          open(path, "w").write("\n".join(lines))
          EOF

      - name: Export iOS (Xcode project only)
        run: |
          set -euo pipefail
          mkdir -p build/ios && touch build/.gdignore
          timeout 600 godot --headless --path . --export-release "iOS" build/ios/WhiteSum.ipa
          test -f build/ios/WhiteSum.xcodeproj/project.pbxproj
          test -n "$(find build/ios -name '*.pck' -print -quit)"
          { echo '```'; find build/ios -maxdepth 2 | sort; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the project
        run: tar -czf build/ios-project.tgz -C build ios

      - uses: actions/upload-artifact@v7
        with:
          name: ios-project
          path: build/ios-project.tgz
          retention-days: 1
          compression-level: 0

  build:
    needs: export
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    env:
      VERSION: ${{ needs.export.outputs.version }}
      BUILD: ${{ needs.export.outputs.build }}
      SIGNING: ${{ needs.export.outputs.signing }}
      UPLOAD: ${{ needs.export.outputs.upload }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ios-project
          path: build

      - name: Unpack the project
        run: |
          set -euo pipefail
          tar -xzf build/ios-project.tgz -C build
          test -f build/ios/WhiteSum.xcodeproj/project.pbxproj

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          app=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)
          if [ -z "$app" ]; then echo "::error::no Xcode 26 on this runner image"; exit 1; fi
          sudo xcode-select -s "$app"
          { echo '```'; xcodebuild -version; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Certificate (signing)
        if: env.SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/ios.keychain-db"
          kcpw=$(openssl rand -hex 24)
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" > /dev/null
          existing=$(security list-keychains -d user | sed 's/[" ]//g')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$kc" $existing
          idents() { security find-identity -v -p codesigning "$kc" | grep -c '"Apple Distribution' || true; }
          if [ "$(idents)" != 1 ]; then
            # incomplete chain: add Apple's WWDR intermediate (G3) and look again
            curl -sSfL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
            security import "$RUNNER_TEMP/wwdr.cer" -k "$kc" -T /usr/bin/codesign
          fi
          n=$(idents)
          if [ "$n" != 1 ]; then echo "::error::expected exactly one valid Apple Distribution identity, found $n"; exit 1; fi
          echo "Signing identity: Apple Distribution (1 valid)" >> "$GITHUB_STEP_SUMMARY"

      - name: Provisioning profile (signing)
        if: env.SIGNING == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          uuid=$(pb UUID); name=$(pb Name); team=$(pb TeamIdentifier:0)
          appid=$(pb Entitlements:application-identifier)
          expires=$(pb ExpirationDate)
          if [ "$appid" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::profile application-identifier does not match team and bundle id"; exit 1
          fi
          if [ "$team" != "$TEAM_ID" ]; then echo "::error::profile team does not match APPLE_TEAM_ID"; exit 1; fi
          exp_epoch=$(date -j -f "%a %b %d %T %Z %Y" "$expires" +%s)
          now=$(date +%s)
          if [ "$exp_epoch" -le "$now" ]; then echo "::error::provisioning profile expired ($expires)"; exit 1; fi
          if [ "$exp_epoch" -le $((now + 30 * 86400)) ]; then
            echo "::warning::provisioning profile expires within 30 days ($expires)"
          fi
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$uuid.mobileprovision"
          done
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "Profile: $name, expires $expires" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive
        run: |
          set -euo pipefail
          proj=build/ios/WhiteSum.xcodeproj
          scheme=WhiteSum
          if ! xcodebuild -list -project "$proj" | grep -qx "[[:space:]]*$scheme"; then
            scheme=$(xcodebuild -list -project "$proj" -json | /usr/bin/python3 -I -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
            echo "::warning::scheme WhiteSum not found, using $scheme"
          fi
          echo "Scheme: $scheme" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNING" = true ]; then
            sign=(CODE_SIGN_STYLE=Manual "DEVELOPMENT_TEAM=$TEAM_ID" "CODE_SIGN_IDENTITY=Apple Distribution"
                  "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN")
          else
            sign=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi
          if ! xcodebuild archive -project "$proj" -scheme "$scheme" -configuration Release \
              -destination 'generic/platform=iOS' -archivePath build/ios/WhiteSum.xcarchive "${sign[@]}" \
              > build/ios/archive.log 2>&1; then
            tail -n 200 build/ios/archive.log; exit 1
          fi
          tail -n 3 build/ios/archive.log

      - name: Export options (signing)
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          f=build/ios/ExportOptions.plist
          rm -f "$f"
          pb() { /usr/libexec/PlistBuddy -c "$1" "$f" > /dev/null; }
          pb "Add :method string app-store-connect"
          pb "Add :teamID string $TEAM_ID"
          pb "Add :signingStyle string manual"
          pb "Add :signingCertificate string Apple Distribution"
          pb "Add :provisioningProfiles dict"
          pb "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_UUID"
          pb "Add :uploadSymbols bool true"
          pb "Add :manageAppVersionAndBuildNumber bool false"
          pb "Add :destination string export"

      - name: IPA (signing)
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          if ! xcodebuild -exportArchive -archivePath build/ios/WhiteSum.xcarchive -exportPath build/ios/export \
              -exportOptionsPlist build/ios/ExportOptions.plist > build/ios/export.log 2>&1; then
            tail -n 200 build/ios/export.log; exit 1
          fi
          n=$(find build/ios/export -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')
          if [ "$n" != 1 ]; then echo "::error::expected exactly one IPA, found $n"; exit 1; fi

      - name: Verify the app bundle
        run: |
          set -euo pipefail
          fail=0
          {
            echo "| Check | Expected | Actual | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          rec() { # name expected actual
            local r=ok
            if [ "$2" != "$3" ]; then r=FAIL; fail=1; echo "::error::$1: expected '$2', got '$3'"; fi
            echo "| $1 | $2 | $3 | $r |" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "$SIGNING" = true ]; then
            rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
            unzip -q build/ios/export/*.ipa -d "$RUNNER_TEMP/ipa"
            app=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          else
            app=$(find build/ios/WhiteSum.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          fi
          if [ -z "$app" ]; then echo "::error::no .app found"; exit 1; fi
          plist="$app/Info.plist"
          x=$(plutil -convert xml1 -o - "$plist")
          get() { plutil -extract "$1" raw -o - "$plist" 2> /dev/null || echo "(absent)"; }
          json() { plutil -extract "$1" json -o - "$plist" 2> /dev/null || echo "(absent)"; }
          once() { rec "$1 occurs once" 1 "$(printf '%s\n' "$x" | grep -c "<key>$1</key>" || true)"; }
          rec "CFBundleIdentifier" "$BUNDLE_ID" "$(get CFBundleIdentifier)"
          rec "CFBundleShortVersionString" "$VERSION" "$(get CFBundleShortVersionString)"
          rec "CFBundleVersion" "$BUILD" "$(get CFBundleVersion)"
          name=$(get CFBundleDisplayName)
          [ "$name" = "(absent)" ] && name=$(get CFBundleName)
          rec "Display name" "White Sum" "$name"
          rec "MinimumOSVersion" "$MIN_IOS" "$(get MinimumOSVersion)"
          rec "UIDeviceFamily" "[1]" "$(json UIDeviceFamily)"
          rec "UISupportedInterfaceOrientations" '["UIInterfaceOrientationPortrait"]' "$(json UISupportedInterfaceOrientations)"
          ipad=$(json 'UISupportedInterfaceOrientations~ipad')
          if [ "$ipad" != "(absent)" ]; then
            rec "UISupportedInterfaceOrientations~ipad" '["UIInterfaceOrientationPortrait"]' "$ipad"
          fi
          rec "ITSAppUsesNonExemptEncryption" false "$(get ITSAppUsesNonExemptEncryption)"
          rec "CFBundleLocalizations" '["en","nl"]' "$(json CFBundleLocalizations)"
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption \
                   CFBundleLocalizations UIDeviceFamily UISupportedInterfaceOrientations; do once "$k"; done
          priv=$(find "$app" -maxdepth 2 -name PrivacyInfo.xcprivacy | head -n 1)
          if [ -n "$priv" ]; then
            rec "PrivacyInfo NSPrivacyTracking" false "$(plutil -extract NSPrivacyTracking raw -o - "$priv" 2> /dev/null || echo "(absent)")"
            collected=$(plutil -extract NSPrivacyCollectedDataTypes json -o - "$priv" 2> /dev/null || echo "[]")
            rec "PrivacyInfo collected data types" "[]" "$collected"
          else
            rec "PrivacyInfo.xcprivacy" present absent
          fi
          rec "pck in the bundle" yes "$([ -n "$(find "$app" -name '*.pck' -print -quit)" ] && echo yes || echo no)"
          icons=build/ios/WhiteSum/Images.xcassets/AppIcon.appiconset
          alpha=0; big=no
          for f in "$icons"/*.png; do
            [ "$(sips -g hasAlpha "$f" | awk '/hasAlpha/ {print $2}')" = no ] || alpha=$((alpha + 1))
            [ "$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')" = 1024 ] && big=yes
          done
          rec "App icons with alpha" 0 "$alpha"
          rec "App icon 1024x1024 present" yes "$big"
          splash=build/ios/WhiteSum/Images.xcassets/SplashImage.imageset
          big_splash=0; n_splash=0
          for f in "$splash"/*.png; do
            n_splash=$((n_splash + 1))
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')
            a=$(sips -g hasAlpha "$f" | awk '/hasAlpha/ {print $2}')
            if [ "$w" -gt 64 ] || [ "$h" -gt 64 ] || [ "$a" != yes ]; then big_splash=$((big_splash + 1)); fi
          done
          rec "Launch images present" yes "$([ "$n_splash" -gt 0 ] && echo yes || echo no)"
          rec "Launch images over 64 px or opaque" 0 "$big_splash"
          if [ "$SIGNING" = true ]; then
            codesign --verify --deep --strict "$app" && cs=ok || cs=failed
            rec "codesign --verify --deep --strict" ok "$cs"
            codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/ent.plist" 2> /dev/null || true
            rec "get-task-allow" false "$(plutil -extract get-task-allow raw -o - "$RUNNER_TEMP/ent.plist" 2> /dev/null || echo "(absent)")"
            security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/embedded.plist"
            rec "embedded profile UUID" "$PROFILE_UUID" "$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/embedded.plist")"
          fi
          if [ "$fail" != 0 ]; then exit 1; fi

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          ipa=$(find build/ios/export -maxdepth 1 -name '*.ipa' | head -n 1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded White Sum $VERSION ($BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-logs
          path: build/ios/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12" \
                "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ent.plist" \
                "$RUNNER_TEMP/embedded.plist" "$RUNNER_TEMP/wwdr.cer"
          rm -rf "$RUNNER_TEMP/ipa"
